name: Update Risk Data

on:
  schedule:
    # Toutes les 15 min de 15h à 21h45 UTC (17h à 23h45 heure d'été de Paris),
    # de mai à septembre. Le script vérifie lui-même la saison et l'heure exactes.
    - cron: 7,22,37,52 15-21 * 5-9 *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-risk-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run history script
        run: node scripts/update-history.mjs
        env:
          # Un lancement manuel ignore la saison et l'horaire
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: Commit and Push changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historique.json
          git diff-index --quiet HEAD || git commit -m "Mise à jour automatique des risques"
          git push
