name: Update Risk Data

on:
  schedule:
    - cron: 12,27,42,57 14-18 * * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-risk-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run history script
        run: node scripts/update-history.mjs

      - name: Commit and Push changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add historique.json
          git diff-index --quiet HEAD || git commit -m "Mise à jour automatique des risques"
          git push
