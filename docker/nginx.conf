server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # historique.json vient du volume partagé avec le service « updater »
    location = /historique.json {
        alias /data/historique.json;
        add_header Cache-Control "no-cache";
    }

    # Toujours revalider les données et le service worker
    location ~* \.(json|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
