services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - data:/data:ro
    restart: unless-stopped

  updater:
    build:
      context: .
      target: updater
    volumes:
      - data:/data
    environment:
      # Alertes ntfy (voir README) : laisser NTFY_TOPIC vide pour les désactiver
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      NTFY_SERVER: ${NTFY_SERVER:-}
      ALERT_MIN_COLOR: ${ALERT_MIN_COLOR:-}
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped

volumes:
  data:
