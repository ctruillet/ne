services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - data:/data:ro
    restart: unless-stopped

  updater:
    build:
      context: .
      target: updater
    volumes:
      - data:/data
    environment:
      # Alertes e-mail (voir README) : laisser SMTP_HOST vide pour les désactiver
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_MIN_COLOR: ${ALERT_MIN_COLOR:-}
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped

volumes:
  data:
